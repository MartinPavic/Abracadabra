# Untested: the project had no git remote when this was written.
stages: [check, bundle]

frontend:
  stage: check
  image: node:22
  script:
    - corepack enable
    - pnpm install --frozen-lockfile
    - npx tsc --noEmit
    - pnpm test
    - pnpm build

backend:
  stage: check
  image: rust:1
  before_script:
    - apt-get update && apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev libsecret-1-dev git
  script:
    - cd src-tauri
    - cargo test
    - cargo clippy --all-targets -- -D warnings

# Needs a macOS runner tagged "macos". Runs for every tag (the release build) and
# can be started by hand on other pipelines; produces the unsigned .app/.dmg.
macos-bundle:
  stage: bundle
  tags: [macos]
  rules:
    - if: $CI_COMMIT_TAG
    - when: manual
  script:
    - pnpm install --frozen-lockfile
    - pnpm tauri build
  artifacts:
    name: abracadabra-$CI_COMMIT_REF_NAME
    paths:
      - src-tauri/target/release/bundle/macos/*.app
      - src-tauri/target/release/bundle/dmg/*.dmg
